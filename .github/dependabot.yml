version: 2
# Monthly, one grouped PR per ecosystem, opened against `dev` (never straight to production).
# Major versions are skipped here; upgrade those deliberately. Security updates still arrive.
updates:
  - package-ecosystem: pip
    directory: /
    target-branch: dev
    schedule: {interval: monthly}
    groups:
      all:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /web
    target-branch: dev
    schedule: {interval: monthly}
    groups:
      all:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /site
    target-branch: dev
    schedule: {interval: monthly}
    groups:
      all:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule: {interval: monthly}
    groups:
      all:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /web
    target-branch: dev
    schedule: {interval: monthly}
    groups:
      all:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /site
    target-branch: dev
    schedule: {interval: monthly}
    groups:
      all:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule: {interval: monthly}
    groups:
      all:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
