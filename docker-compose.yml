x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # tuned for a 4 GB server shared with the app containers
    command:
      - postgres
      - -c
      - shared_buffers=384MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=96MB
      - -c
      - wal_compression=on
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - log_min_duration_statement=1000
    shm_size: 256mb
    mem_limit: 1g
    environment:
      POSTGRES_DB: coach
      POSTGRES_USER: coach
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coach -d coach"]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 256m
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging

  bot:
    build: .
    restart: unless-stopped
    mem_limit: 640m
    env_file:
      - .env
      - .env.live
    environment:
      MIGRATE_ON_START: ${MIGRATE_ON_START:-true}
      CATALOG_STORAGE: /app/catalog-files
      DIAGNOSTICS_DIR: /app/diagnostics
    volumes:
      - catalogfiles:/app/catalog-files
      - ./artifacts/diagnostics:/app/diagnostics
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-m", "app.main"]
    ports:
      - "127.0.0.1:8080:8080"
    logging: *default-logging

  web-api:
    build: .
    restart: unless-stopped
    mem_limit: 640m
    env_file:
      - .env
      - .env.live
    environment:
      MIGRATE_ON_START: "false"
      WEB_TRUST_INGRESS: "true"
      CATALOG_STORAGE: /app/catalog-files
      DIAGNOSTICS_DIR: /app/diagnostics
    volumes:
      - catalogfiles:/app/catalog-files
      - ./artifacts/diagnostics:/app/diagnostics
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-m", "app.webapp"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    logging: *default-logging

  web:
    build:
      context: ./web
      args:
        BACKEND_URL: http://web-api:8090
    restart: unless-stopped
    mem_limit: 512m
    environment:
      BACKEND_URL: http://web-api:8090
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    init: true
    depends_on:
      web-api:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    logging: *default-logging

  # Public landing page (main domain). Host Nginx proxies the main domain to 127.0.0.1:3100.
  # Business identity and trust-seal IDs come from the server's .env (see docs/LAUNCH.md).
  site:
    build:
      context: ./site
      args: &site-env
        SITE_URL: ${SITE_URL:-https://sensibot.ir}
        BOT_USERNAME: ${BOT_USERNAME:-}
        BUSINESS_LEGAL_NAME: ${BUSINESS_LEGAL_NAME:-}
        BUSINESS_ADDRESS: ${BUSINESS_ADDRESS:-}
        BUSINESS_POSTAL_CODE: ${BUSINESS_POSTAL_CODE:-}
        BUSINESS_PHONE: ${BUSINESS_PHONE:-}
        BUSINESS_EMAIL: ${BUSINESS_EMAIL:-}
        BUSINESS_HOURS: ${BUSINESS_HOURS:-}
        ENAMAD_ID: ${ENAMAD_ID:-}
        ENAMAD_CODE: ${ENAMAD_CODE:-}
        SAMANDEHI_ID: ${SAMANDEHI_ID:-}
        SAMANDEHI_P: ${SAMANDEHI_P:-}
        ZARINPAL_TRUST: ${ZARINPAL_TRUST:-}
    restart: unless-stopped
    mem_limit: 512m
    # the same values at runtime, because pages are rendered per request
    environment:
      <<: *site-env
      CATALOG_API_URL: http://web-api:8090/api/public/catalog
    # writable: Next.js keeps its cache under /app/.next (runs as an unprivileged user)
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    init: true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3100/robots.txt"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    ports:
      - "127.0.0.1:3100:3100"
    logging: *default-logging

  ingress:
    image: nginx:stable-alpine
    restart: unless-stopped
    mem_limit: 96m
    user: "101:101"
    entrypoint: ["nginx", "-g", "daemon off;"]
    read_only: true
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101
      - /var/run:uid=101,gid=101
    volumes:
      - ./deploy/ingress.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/trusted-proxies.conf:/etc/nginx/trusted-proxies.conf:ro
    ports:
      - "${INGRESS_BIND_IP:-127.0.0.1}:8090:3000"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      web:
        condition: service_healthy
        restart: true
    logging: *default-logging

volumes:
  pgdata:
  redisdata:
  catalogfiles:
