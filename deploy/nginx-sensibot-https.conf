# Host Nginx, step 2 of 2 (HTTPS). Needs the certificate from:
#   sudo certbot certonly --webroot -w /var/www/html -d sensibot.ir -d www.sensibot.ir -d apanel.sensibot.ir
#
#   sensibot.ir        landing page (site container, 127.0.0.1:3100)
#                      + bot endpoints and download links (inner ingress, 127.0.0.1:8090)
#   www.sensibot.ir    permanent redirect to sensibot.ir
#   apanel.sensibot.ir  staff panel and API (inner ingress, 127.0.0.1:8090)

server {
    listen 443 ssl http2;
    ssl_certificate     /etc/letsencrypt/live/sensibot.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sensibot.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SensiSSL:10m;
    server_name sensibot.ir;
    server_tokens off;
    client_max_body_size 1m;
    client_body_timeout 10s;
    limit_conn edge_conn 60;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";

    # Telegram, ZarinPal and bot download links (PUBLIC_BASE_URL=https://sensibot.ir)
    location = /telegram/webhook { proxy_pass http://127.0.0.1:8090; }
    location = /payment/zarinpal/callback { proxy_pass http://127.0.0.1:8090; }
    location /content/ {
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_pass http://127.0.0.1:8090;
    }
    location = /health { proxy_pass http://127.0.0.1:8090; }

    # Landing page, cached at the edge. Next.js client-navigation (RSC) requests are never cached.
    location / {
        limit_req zone=edge_site burst=100 nodelay;
        proxy_cache sensi_site;
        proxy_cache_key $scheme$host$request_uri;
        proxy_cache_bypass $http_rsc $http_next_router_prefetch;
        proxy_no_cache $http_rsc $http_next_router_prefetch;
        proxy_cache_valid 200 301 404 60s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        add_header X-Cache $upstream_cache_status always;
        proxy_read_timeout 30s;
        proxy_pass http://127.0.0.1:3100;
    }

    # Hashed build assets never change: cache for 30 days
    location /_next/static/ {
        proxy_cache sensi_site;
        proxy_cache_valid 200 30d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_pass http://127.0.0.1:3100;
    }
}

server {
    listen 443 ssl http2;
    ssl_certificate     /etc/letsencrypt/live/sensibot.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sensibot.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SensiSSL:10m;
    server_name www.sensibot.ir;
    server_tokens off;
    return 301 https://sensibot.ir$request_uri;
}

server {
    listen 443 ssl http2;
    ssl_certificate     /etc/letsencrypt/live/sensibot.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sensibot.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SensiSSL:10m;
    server_name apanel.sensibot.ir;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    limit_conn edge_conn 40;

    # Inner ingress enforces route-specific upload limits; stream bodies here.
    client_max_body_size 0;
    client_body_timeout 20s;
    proxy_request_buffering off;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_buffering off;

    location / {
        limit_req zone=edge_panel burst=80 nodelay;
        proxy_pass http://127.0.0.1:8090;
        proxy_read_timeout 70s;
    }
    location = /api/catalog-assets {
        proxy_pass http://127.0.0.1:8090;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location ~ ^/api/orders/[0-9]+/plan$ {
        proxy_pass http://127.0.0.1:8090;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}
