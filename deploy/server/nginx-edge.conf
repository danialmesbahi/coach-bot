# /etc/nginx/conf.d/coach-edge.conf  (http context, shared by the sensibot.ir sites)
server_tokens off;

# Per-IP request and connection limits. Generous on purpose: Iranian carriers put many users behind one IP.
limit_req_zone  $binary_remote_addr zone=edge_site:10m  rate=30r/s;
limit_req_zone  $binary_remote_addr zone=edge_panel:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=edge_conn:10m;
limit_req_status  429;
limit_conn_status 429;

# Slow-client protection
client_header_timeout 10s;
client_header_buffer_size 4k;
large_client_header_buffers 4 16k;
send_timeout 30s;
reset_timedout_connection on;

# (gzip itself is switched on in Ubuntu's nginx.conf)
# Landing page cache: absorbs traffic spikes and keeps serving the site if its container restarts
proxy_cache_path /var/cache/nginx/sensi levels=1:2 keys_zone=sensi_site:20m max_size=512m inactive=7d use_temp_path=off;

gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types text/plain text/css text/xml application/json application/javascript application/xml application/rss+xml image/svg+xml;
