# /etc/ssh/sshd_config.d/00-coach-hardening.conf  (00- so it wins over cloud-init defaults)
# Key-only login. Recovery path if a key is lost: the ArvanCloud web console.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
PermitEmptyPasswords no
MaxAuthTries 3
MaxSessions 4
LoginGraceTime 20
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
ClientAliveInterval 300
ClientAliveCountMax 2
