# /etc/nginx/sites-available/coach-default
# Requests by bare IP or unknown host names get nothing (no default page, no certificate).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
server {
    listen 443 ssl http2 default_server;
    server_name _;
    ssl_reject_handshake on;
}
