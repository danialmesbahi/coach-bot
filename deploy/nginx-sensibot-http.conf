# Host Nginx, step 1 of 2 (HTTP only): serves Certbot's challenge and redirects to HTTPS.
# Install: sudo cp deploy/nginx-sensibot-http.conf /etc/nginx/sites-available/sensibot-http
#          sudo ln -sf /etc/nginx/sites-available/sensibot-http /etc/nginx/sites-enabled/
server {
    listen 80;
    listen [::]:80;
    server_name sensibot.ir www.sensibot.ir apanel.sensibot.ir;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
