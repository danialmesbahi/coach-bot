# The only published HTTP entrypoint. Do not expose web or web-api directly.
limit_req_zone $binary_remote_addr zone=login:1m rate=20r/m;
limit_req_zone $binary_remote_addr zone=callback:1m rate=2r/s;
limit_req_zone $binary_remote_addr zone=content:1m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=downloads:1m;
# Trust forwarded client identity only from explicitly configured edge peers.
include /etc/nginx/trusted-proxies.conf;
real_ip_header X-Real-IP;
real_ip_recursive off;
map $http_x_forwarded_proto $external_proto {
    default $scheme;
    https https;
}

server {
    listen 3000;
    resolver 127.0.0.11 ipv6=off valid=10s;
    server_tokens off;
    access_log off;
    client_max_body_size 51m;
    client_body_timeout 20s;
    limit_req_status 429;
    error_page 429 = @rate_limited;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $external_proto;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Coach-Client-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 70s;

    location @rate_limited {
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"error":"rate_limited"}';
    }
    location = /api/auth/password {
        limit_req zone=login burst=5 nodelay;
        client_max_body_size 4k;
        proxy_pass http://web-api:8090;
    }
    location = /api/events {
        proxy_buffering off;
        proxy_pass http://web-api:8090;
    }
    location ~ ^/api/orders/[0-9]+/plan$ {
        client_max_body_size 510m;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_pass http://web-api:8090;
    }
    # Stream private media instead of buffering large previews to nginx's temp disk.
    location ~ ^/api/catalog-assets/[0-9]+/preview$ {
        limit_conn downloads 8;
        proxy_buffering off;
        proxy_pass http://web-api:8090;
    }
    location /api/ { proxy_pass http://web-api:8090; }
    # Authenticated coach-only streaming; content.store_upload checks disk reserve
    # each MiB (20% free / 1 GiB minimum), 2 concurrent uploads, 30s idle deadline.
    # Other upload routes keep their existing per-file limits.
    location = /api/catalog-assets {
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 60s;
        proxy_pass http://web-api:8090;
    }
    location /content/ {
        limit_req zone=content burst=20 nodelay;
        limit_conn downloads 8;
        proxy_pass http://web-api:8090;
    }
    location /auth/ { proxy_pass http://web-api:8090; }
    location /media/ { proxy_pass http://web-api:8090; }
    location = /health { proxy_pass http://web-api:8090; }
    location = /payment/zarinpal/callback {
        limit_req zone=callback burst=5 nodelay;
        set $bot_upstream bot:8080;
        proxy_pass http://$bot_upstream$request_uri;
    }
    location = /telegram/webhook {
        client_max_body_size 2m;
        set $bot_upstream bot:8080;
        proxy_pass http://$bot_upstream$request_uri;
    }
    location / { proxy_pass http://web:3000; }
}
