# The only published HTTP entrypoint. Do not expose web or web-api directly.
limit_req_zone $binary_remote_addr zone=login:1m rate=20r/m;
limit_req_zone $binary_remote_addr zone=callback:1m rate=2r/s;
# Trust forwarded client identity only from explicitly configured edge peers.
include /etc/nginx/trusted-proxies.conf;
real_ip_header X-Real-IP;
real_ip_recursive off;
map $http_x_forwarded_proto $external_proto {
    default $scheme;
    https https;
}

server {
    listen 3000;
    server_tokens off;
    access_log off;
    client_max_body_size 51m;
    client_body_timeout 20s;
    limit_req_status 429;
    error_page 429 = @rate_limited;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $external_proto;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Coach-Client-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 70s;

    location @rate_limited {
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"error":"rate_limited"}';
    }
    location = /api/auth/bot/start {
        limit_req zone=login burst=5 nodelay;
        client_max_body_size 16k;
        proxy_pass http://web-api:8090;
    }
    location = /api/events {
        proxy_buffering off;
        proxy_pass http://web-api:8090;
    }
    location /api/ { proxy_pass http://web-api:8090; }
    location /auth/ { proxy_pass http://web-api:8090; }
    location /media/ { proxy_pass http://web-api:8090; }
    location = /health { proxy_pass http://web-api:8090; }
    location = /payment/zarinpal/callback {
        limit_req zone=callback burst=5 nodelay;
        proxy_pass http://bot:8080;
    }
    location = /telegram/webhook {
        client_max_body_size 2m;
        proxy_pass http://bot:8080;
    }
    location / { proxy_pass http://web:3000; }
}
